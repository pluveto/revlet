name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pyright
      - run: uv run --no-sync python -m mypy.stubtest revlet
      - name: Build sdist, then build wheel from sdist
        run: uv run --no-sync python -m build
      - run: uv run --no-sync python scripts/check_dist.py
      - run: uv run --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"
          - os: macos-15
            python: "3.14"
          - os: macos-15-intel
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - run: uv sync --locked --no-dev --group test --no-install-project
      - name: Install the artifact that will be published
        run: uv pip install --no-deps --no-index --find-links dist revlet
      - run: uv run --no-sync pytest --cov=revlet --cov-report=term-missing
      - run: uv run --no-sync python examples/basic.py
      - run: uv run --no-sync python examples/adapters.py
      - run: uv run --no-sync python examples/cycles.py
      - name: Check benchmark scenarios and report generation
        run: |
          uv run --no-sync python benchmarks/bench_engine.py --sizes 16 --iterations 3 --warmups 2 --fanout 4 --json benchmark-smoke.json
          uv run --no-sync python benchmarks/report.py "benchmark-smoke*.json" --output benchmark-smoke.md
